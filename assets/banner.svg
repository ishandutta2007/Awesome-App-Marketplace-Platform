<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 21px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 22px;
        fill: #ffffff;
      }
      .metric-sub {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #94a3b8;
      }

      /* Animated SVG Elements */
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.7; }
      }
      @keyframes floatNode1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatNode2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(12px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }

      .animated-orb1 {
        animation: pulseOrb 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .animated-orb2 {
        animation: pulseOrb 10s ease-in-out infinite reverse;
        transform-origin: 1000px 300px;
      }
      .float-card1 {
        animation: floatNode1 6s ease-in-out infinite;
      }
      .float-card2 {
        animation: floatNode2 7s ease-in-out infinite;
      }
      .dash-flow {
        stroke-dasharray: 6, 6;
        animation: dashAnim 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle cx="220" cy="120" r="240" fill="url(#glow1)" class="animated-orb1" />
  <circle cx="980" cy="300" r="260" fill="url(#glow2)" class="animated-orb2" />

  <!-- Subtle Circuit / Tech Grid Pattern in Background -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1.2">
    <line x1="50" y1="40" x2="1150" y2="40" />
    <line x1="50" y1="380" x2="1150" y2="380" />
    <line x1="80" y1="20" x2="80" y2="400" />
    <line x1="1120" y1="20" x2="1120" y2="400" />
    <circle cx="80" cy="40" r="4" fill="#6366f1" />
    <circle cx="1120" cy="40" r="4" fill="#6366f1" />
    <circle cx="80" cy="380" r="4" fill="#6366f1" />
    <circle cx="1120" cy="380" r="4" fill="#6366f1" />
  </g>

  <!-- Dynamic Connecting Flows (behind cards) -->
  <g stroke="url(#primaryGrad)" stroke-width="2" fill="none" opacity="0.35">
    <path d="M 280 330 C 450 380, 750 380, 920 330" class="dash-flow" />
  </g>

  <!-- Title & Subtitle in Foreground (Never blocked) -->
  <g id="foreground-content">
    <!-- Top Pill / Badge -->
    <g transform="translate(60, 50)">
      <rect width="270" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="18" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" class="tag-text" fill="#cbd5e1">CURATED DEVELOPER DIRECTORY</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="60" y="145" class="title-text" fill="url(#primaryGrad)" filter="url(#softGlow)">Awesome App Marketplace Platform</text>

    <!-- Subtitle -->
    <text x="60" y="195" class="subtitle-text">Curated Registries, Federated App Stores &amp; Multi-Vendor Marketplace Engines</text>

    <!-- Tag Pills Row -->
    <g transform="translate(60, 235)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="20" y="23" class="tag-text">🏪 App Store Engines</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(182, 0)">
        <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="20" y="23" class="tag-text">🧩 Extension Registries</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(374, 0)">
        <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="20" y="23" class="tag-text">🌐 Federated Stores</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(551, 0)">
        <rect width="175" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="20" y="23" class="tag-text">💳 Multi-Vendor SaaS</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(738, 0)">
        <rect width="155" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="20" y="23" class="tag-text">🤖 AI Agent Hubs</text>
      </g>
    </g>

    <!-- Feature Metric Cards (Bottom Row) -->
    <!-- Card 1: Open Source Repos -->
    <g transform="translate(60, 300)" class="float-card1">
      <rect width="320" height="75" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.9" />
      <rect x="16" y="16" width="44" height="44" rx="10" fill="#312e81" />
      <text x="38" y="44" font-size="22" text-anchor="middle">⭐</text>
      <text x="74" y="42" class="metric-title">20,000+ Stars</text>
      <text x="74" y="60" class="metric-sub">Top Open-Source Ecosystems</text>
    </g>

    <!-- Card 2: Commercial & SaaS -->
    <g transform="translate(410, 300)" class="float-card2">
      <rect width="320" height="75" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.9" />
      <rect x="16" y="16" width="44" height="44" rx="10" fill="#1e1b4b" />
      <text x="38" y="44" font-size="22" text-anchor="middle">📊</text>
      <text x="74" y="42" class="metric-title">$1T+ Cloud Market</text>
      <text x="74" y="60" class="metric-sub">Commercial &amp; SaaS Hyperscalers</text>
    </g>

    <!-- Card 3: Neutral & Federated -->
    <g transform="translate(760, 300)" class="float-card1">
      <rect width="380" height="75" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.9" />
      <rect x="16" y="16" width="44" height="44" rx="10" fill="#064e3b" />
      <text x="38" y="44" font-size="22" text-anchor="middle">⚡</text>
      <text x="74" y="42" class="metric-title">Zero-Fee &amp; Self-Hosted</text>
      <text x="74" y="60" class="metric-sub">Federated, Air-Gapped &amp; Independent</text>
    </g>
  </g>
</svg>
